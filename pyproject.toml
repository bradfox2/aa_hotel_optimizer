[project]
name = "aa-hotel-optimizer"
version = "0.2.0"
description = "Hotel booking comparisons, Loyalty Point planning, and a paid-service API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.33.0",
    "tqdm>=4.67.0",
    "streamlit>=1.54.0",
    "pandas>=2.2.3",
    "matplotlib>=3.10.0",
    "altair>=5.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sqlalchemy>=2.0.40",
    "alembic>=1.15.0",
    "pydantic-settings>=2.8.0",
    "email-validator>=2.2.0",
    "stripe>=12.0.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.28.0", "ruff>=0.11.0", "playwright>=1.51.0"]

[project.scripts]
lp-optimizer = "aa_hotel_optimizer.service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aa_hotel_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
